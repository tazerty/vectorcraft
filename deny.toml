# cargo-deny : configuration écrite par Evora (fork tazerty/vectorcraft, EVORA-SIN-04, CI).
# L'amont n'a pas de deny.toml. Portée : le graphe du binaire web livré (apps/vectorcraft-web,
# cible wasm32), sans les dépendances de développement. La CI lance :
#   cargo deny --manifest-path apps/vectorcraft-web/Cargo.toml --locked check
# Rien n'est relâché en silence : les réglages ci-dessous sont les valeurs par défaut ou plus
# stricts ; chaque exception porte sa raison écrite, et la CI imprime le rapport complet.

[graph]
targets = ["wasm32-unknown-unknown"]
exclude-dev = true
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Une vulnérabilité est toujours une erreur ; on y ajoute les avis « non maintenu » et « non sûr »
# sur tout le graphe, et les versions retirées (yanked) du registre.
unmaintained = "all"
unsound = "all"
yanked = "deny"
# Exceptions motivées (relevées au run 38367552128, Cargo.lock du tag amont v0.10.0 ; seul écart :
# ruzstd 0.9.0 → 0.9.1, correctif de la vulnérabilité RUSTSEC-2026-0344, EVORA-SIN-20).
# Aucune n'est une vulnérabilité ; à réexaminer à chaque montée de version.
ignore = [
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz 0.20.1 non maintenu (avis informatif, aucun correctif publié) ; dépendance transitive de krilla 0.8.2 (export PDF, vectorcraft-pdf L3) ; son remplacement relève de krilla et de l'amont" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 non maintenu (avis informatif) ; tiré par rustybuzz, via krilla 0.8.2 ; même motif" },
    { crate = "yoke-derive@0.8.3", reason = "version retirée du registre le 2026-09 sans avis de sécurité ; macro procédurale (compilation seulement) tirée par yoke 0.8.3 ; le Cargo.lock amont est gardé tel quel (--locked), mise à jour à la prochaine montée" },
]

[licenses]
# Licences rencontrées dans le graphe web ; toute autre licence fait échouer la porte.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception", # wasmparser
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "BSL-1.0", # ryu
    "Unicode-3.0", # icu_*, zerovec…
    "OFL-1.1", # epaint_default_fonts (polices par défaut d'egui)
    "Ubuntu-font-1.0", # epaint_default_fonts (Ubuntu Light)
    "IJG", # jpeg-encoder : « based in part on the work of the Independent JPEG Group » (NOTICE)
]
confidence-threshold = 0.8
exceptions = []
unused-allowed-license = "warn"

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# craft-libs (craft-ui, craft-print), épinglé par révision dans Cargo.toml et Cargo.lock.
allow-git = ["https://github.com/storytold/craft-libs"]
