# Evora : build web (wasm) de la branche evora/<tag-amont> du fork tazerty/vectorcraft.
#
# Écrit par Evora (patch EVORA-SIN-00, portes EVORA-SIN-04) à partir de packaging/web/package.sh et
# de docs/development.md (« Web build ») de l'amont storytold/vectorcraft (MIT OR Apache-2.0).
# Rien n'est copié de storytold/craft-common-actions. Aucune action tierce : seulement
# actions/checkout, actions/cache, actions/upload-artifact et actions/download-artifact, épinglées
# par SHA complet. Outils épinglés et vérifiés par SHA-256 ; Trunk tourne hors ligne (--offline), il
# ne télécharge donc rien lui-même et doit trouver les outils épinglés dans le PATH.
# Versions relevées sur le job « Web (wasm) » de la release amont v0.10.0
# (run 38236402476) : rustc 1.99.0, trunk 0.21.14, wasm-bindgen 0.2.129, wasm-opt version_123.
#
# Portes (bloquantes depuis le patch E1) :
#   job licences : cargo-deny (licences, avis de sécurité, interdits, sources) et cargo-about
#                  (LICENSES/THIRD-PARTY-LICENSES.txt) ;
#   job web      : marques ArtCraft dans le bundle, fichiers d'hébergement, termes sensibles (E9),
#                  émojis des catalogues affichés (E10), empreintes CSP, tests de fumée Chrome depuis
#                  une autre origine : « base » (langue imposée E3, thème imposé vérifié au rendu E2,
#                  ?host=evora qui n'efface rien et pont muet sans origine admise E5/E4), « pont-ehp »
#                  (pont EHP v1 natif E4 et purge E5 sur messages vérifiés), et deux témoins sabordés
#                  qui doivent rougir pour les raisons attendues (origine non admise, détecteurs).
#                  Sorties .br et .gz, mesure de taille.
# Le zip et l'artefact ne sont produits que si toutes les portes sont vertes ; ils portent le nom
# Evora evora-sinopia-pro-web-<tag> (EVORA-SIN-10).
name: Evora web

on:
  push:
    branches: ["evora/**"]
  workflow_dispatch:

permissions:
  contents: read

# bash -eo pipefail pour toutes les étapes : une porte dont la sortie passe par `tee` garde son code.
defaults:
  run:
    shell: bash

concurrency:
  group: evora-web-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  VECTORCRAFT_BUILD_SHA: ${{ github.sha }}
  # Pas de rust-toolchain(.toml) dans le dépôt ; rust-version = 1.95 dans Cargo.toml.
  RUST_TOOLCHAIN: 1.99.0
  TRUNK_VERSION: 0.21.14
  TRUNK_SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b
  # Doit égaler la version de wasm-bindgen du Cargo.lock (Trunk l'exige).
  WASM_BINDGEN_VERSION: 0.2.129
  WASM_BINDGEN_SHA256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
  BINARYEN_VERSION: version_123
  BINARYEN_SHA256: e959f2170af4c20c552e9de3a0253704d6a9d2766e8fdb88e4d6ac4bae9388fe
  # Portes de licences : binaires de release, empreintes égales au digest GitHub des assets.
  CARGO_DENY_VERSION: 0.20.2
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
  CARGO_ABOUT_VERSION: 0.9.2
  CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
  # craft-fonts : même commit que le job web de release.yml au tag amont.
  CRAFT_FONTS_REF: 3d9ab3a132ed0eff457e424226a435a901da30d3

jobs:
  licences:
    name: Licences et avis de sécurité (cargo-deny, cargo-about)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain Rust (rustup, version épinglée)
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          case "$(rustc -V)" in
            "rustc $RUST_TOOLCHAIN "*) ;;
            *) echo "::error::rustc n'est pas $RUST_TOOLCHAIN"; exit 1 ;;
          esac

      - name: cargo-deny et cargo-about (binaires de release vérifiés par SHA-256)
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/evora-tools"
          DL="$RUNNER_TEMP/evora-dl"
          mkdir -p "$TOOLS/bin" "$DL/deny" "$DL/about"
          fetch() { # url sha256 fichier
            curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$DL/$3" "$1"
            echo "$2  $DL/$3" | sha256sum -c -
          }
          fetch "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            "$CARGO_DENY_SHA256" deny.tar.gz
          tar -xzf "$DL/deny.tar.gz" -C "$DL/deny"
          install -m 0755 "$(find "$DL/deny" -type f -name cargo-deny | head -n 1)" "$TOOLS/bin/cargo-deny"
          fetch "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            "$CARGO_ABOUT_SHA256" about.tar.gz
          tar -xzf "$DL/about.tar.gz" -C "$DL/about"
          install -m 0755 "$(find "$DL/about" -type f -name cargo-about | head -n 1)" "$TOOLS/bin/cargo-about"
          rm -rf "$DL"
          echo "$TOOLS/bin" >> "$GITHUB_PATH"
          "$TOOLS/bin/cargo-deny" --version
          "$TOOLS/bin/cargo-about" --version

      - name: Dépendances cargo (Cargo.lock verrouillé)
        run: cargo fetch --locked

      - name: Inventaire des licences du graphe web (cargo deny list)
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/evora-licences"
          mkdir -p "$OUT"
          cargo deny --manifest-path apps/vectorcraft-web/Cargo.toml --locked --color never \
            list --layout license | tee "$OUT/cargo-deny-list.txt"

      - name: Porte cargo-deny (licences, avis de sécurité, interdits, sources)
        run: |
          set +e
          set -u -o pipefail
          OUT="$RUNNER_TEMP/evora-licences"
          cargo deny --manifest-path apps/vectorcraft-web/Cargo.toml --locked --color never \
            check --show-stats advisories bans licenses sources 2>&1 | tee "$OUT/cargo-deny-check.txt"
          rc=${PIPESTATUS[0]}
          {
            echo "## Evora : porte cargo-deny ($CARGO_DENY_VERSION) sur le graphe web (wasm32, sans dépendances de développement)"
            echo
            echo "- verdict : **$([ "$rc" -eq 0 ] && echo VERTE || echo ROUGE)** (code $rc)"
            echo "- avertissements : $(grep -c '^warning' "$OUT/cargo-deny-check.txt" || true) ; erreurs : $(grep -c '^error' "$OUT/cargo-deny-check.txt" || true)"
            echo "- exceptions motivées de deny.toml (chacune avec sa raison) :"
            grep -E '^\s*\{ (id|crate) = ' deny.toml | sed 's/^ */  - /' || echo "  - aucune"
            echo
            echo '```'
            tail -n 40 "$OUT/cargo-deny-check.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Licences agrégées (cargo about generate)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/evora-licences"
          cargo about generate --locked --fail -m apps/vectorcraft-web/Cargo.toml -c packaging/evora/about.toml \
            -o "$OUT/THIRD-PARTY-LICENSES.txt" packaging/evora/about.hbs
          {
            echo "cargo-deny=$(cargo-deny --version)"
            echo "cargo-about=$(cargo-about --version)"
          } > "$OUT/EVORA-LICENCES.txt"
          {
            echo "## Evora : licences agrégées (cargo-about $CARGO_ABOUT_VERSION)"
            echo
            echo "- \`THIRD-PARTY-LICENSES.txt\` : $(stat -c %s "$OUT/THIRD-PARTY-LICENSES.txt") octets"
            echo
            echo '```'
            sed -n '/^Vue d.ensemble/,/^====/p' "$OUT/THIRD-PARTY-LICENSES.txt" | head -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publication des licences pour le job web
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evora-licences
          path: ${{ runner.temp }}/evora-licences/
          if-no-files-found: error
          retention-days: 7

  tests:
    name: Tests natifs ciblés (modules touchés par Evora)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout craft-fonts (commit épinglé)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
          persist-credentials: false

      - name: Cache cargo (tests natifs)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: evora-tests-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            evora-tests-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-

      - name: Toolchain Rust (rustup, version épinglée)
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          case "$(rustc -V)" in
            "rustc $RUST_TOOLCHAIN "*) ;;
            *) echo "::error::rustc n'est pas $RUST_TOOLCHAIN"; exit 1 ;;
          esac

      # Les tests des modules que les patchs Evora touchent (liens, marque, barre, menus, coches,
      # catalogues i18n, thème, polices) et ceux du moteur pour help.rs (exception L5 d'E1).
      - name: Tests ciblés (cargo test --locked)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: |
          set -euo pipefail
          cargo test --locked -p vectorcraft-engine --lib -- cmd::help
          cargo test --locked -p vectorcraft-ui-egui --lib -- \
            community:: brand:: titlebar:: tests_nativemenu:: tests_contextmenu:: tests_clipboard:: \
            panels::transform:: panels::transparency:: graphics:: i18n:: theme:: tests_font_menu:: tests_home::

  web:
    name: Web (wasm) Evora
    needs: licences
    runs-on: ubuntu-latest
    # Le job web de la release amont dure environ 12 minutes avec cache ; marge pour un build à froid.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout craft-fonts (commit épinglé)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
          persist-credentials: false

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: evora-web-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            evora-web-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-

      - name: Toolchain Rust (rustup, version épinglée)
        run: |
          set -euo pipefail
          rustup --version
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc -Vv
          cargo -V
          case "$(rustc -V)" in
            "rustc $RUST_TOOLCHAIN "*) ;;
            *) echo "::error::rustc n'est pas $RUST_TOOLCHAIN"; exit 1 ;;
          esac
          INSTALLED="$(rustup target list --installed)"
          case "$INSTALLED" in
            *wasm32-unknown-unknown*) ;;
            *) echo "::error::cible wasm32-unknown-unknown absente"; exit 1 ;;
          esac

      - name: Outils de build (binaires de release vérifiés par SHA-256)
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/evora-tools"
          DL="$RUNNER_TEMP/evora-dl"
          mkdir -p "$TOOLS/bin" "$TOOLS/binaryen" "$DL/wasm-bindgen"
          fetch() { # url sha256 fichier
            curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$DL/$3" "$1"
            echo "$2  $DL/$3" | sha256sum -c -
          }
          fetch "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            "$TRUNK_SHA256" trunk.tar.gz
          tar -xzf "$DL/trunk.tar.gz" -C "$TOOLS/bin" trunk
          fetch "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            "$WASM_BINDGEN_SHA256" wasm-bindgen.tar.gz
          tar -xzf "$DL/wasm-bindgen.tar.gz" -C "$DL/wasm-bindgen"
          install -m 0755 "$(find "$DL/wasm-bindgen" -type f -name wasm-bindgen | head -n 1)" "$TOOLS/bin/wasm-bindgen"
          fetch "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            "$BINARYEN_SHA256" binaryen.tar.gz
          tar -xzf "$DL/binaryen.tar.gz" -C "$TOOLS/binaryen" --strip-components=1
          rm -rf "$DL"
          echo "$TOOLS/bin" >> "$GITHUB_PATH"
          echo "$TOOLS/binaryen/bin" >> "$GITHUB_PATH"
          "$TOOLS/bin/trunk" --version
          "$TOOLS/bin/wasm-bindgen" --version
          "$TOOLS/binaryen/bin/wasm-opt" --version

      - name: Outils des portes (préinstallés sur le runner, versions imprimées)
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          [ -n "$CHROME_BIN" ] || { echo "::error::Chrome introuvable sur le runner"; exit 1; }
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
          node --version
          python3 --version
          brotli --version
          gzip --version | sed -n '1p'
          zip -v | sed -n '2p'

      - name: Dépendances cargo (Cargo.lock verrouillé)
        run: cargo fetch --locked

      - name: Build web release (trunk build --release, hors ligne)
        working-directory: apps/vectorcraft-web
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: |
          set -euo pipefail
          command -v trunk wasm-bindgen wasm-opt
          trunk build --release --locked --offline

      - name: Licences agrégées (artefact du job licences)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evora-licences
          path: ${{ runner.temp }}/evora-licences

      - name: Assemblage du site statique
        id: pkg
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SITE="dist/web"
          LIC_IN="$RUNNER_TEMP/evora-licences"
          [ -f "$SITE/index.html" ] || { echo "::error::$SITE/index.html absent"; exit 1; }
          [ -s "$LIC_IN/THIRD-PARTY-LICENSES.txt" ] || { echo "::error::THIRD-PARTY-LICENSES.txt absent"; exit 1; }
          # Même contrôle que packaging/web/package.sh : URLs relatives seulement (public_url = "./").
          if grep -Eq '(src|href)="/[^/]' "$SITE/index.html"; then
            echo "::error::$SITE/index.html contient des URLs absolues à la racine"
            exit 1
          fi
          VERSION="$(awk '/^\[/ { in_pkg = ($0 == "[workspace.package]"); next }
            in_pkg && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)"
          [ -n "$VERSION" ] || { echo "::error::version introuvable dans Cargo.toml"; exit 1; }
          TAG="v$VERSION"
          case "$REF_NAME" in
            evora/*) [ "$REF_NAME" = "evora/$TAG" ] || echo "::warning::branche $REF_NAME différente de evora/$TAG" ;;
          esac
          # Nom Evora de l'artefact (EVORA-SIN-10), pris après le run 38367951778 où E1 et toutes
          # les portes étaient vertes ; jamais avant.
          NAME="evora-sinopia-pro-web-$TAG"
          WORK="$RUNNER_TEMP/evora-pkg"
          OUT="$RUNNER_TEMP/evora-out"
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK/$NAME/LICENSES" "$OUT"
          cp -R "$SITE/." "$WORK/$NAME/"
          # Pas d'exemples de configuration serveur (_headers, .htaccess) : l'hébergement est
          # l'affaire d'Evora, et le provisionnement refuse ces fichiers (porte « hébergement »).
          cp LICENSE-MIT LICENSE-APACHE NOTICE ASSETS.md "$WORK/$NAME/LICENSES/"
          # Mention en texte simple du patch E1 (« basé sur VectorCraft par l'équipe ArtCraft ») et
          # licences des composants tiers agrégées par cargo-about.
          cp packaging/evora/MENTIONS.txt "$WORK/$NAME/LICENSES/MENTIONS-EVORA.txt"
          cp "$LIC_IN/THIRD-PARTY-LICENSES.txt" "$WORK/$NAME/LICENSES/THIRD-PARTY-LICENSES.txt"
          # E4 : origines parentes admises par le pont EHP (?host=evora), même contrat que pdfcraft.
          # Vide dans l'artefact : le provisionnement d'Evora l'écrit depuis engines.json
          # (HOST-PROTOCOL §2.3) ; vide, le pont reste muet.
          printf '{"parentOrigins": []}\n' > "$WORK/$NAME/evora-host.json"
          for ofl in "$CRAFT_FONTS_DIR"/fonts/*/OFL.txt; do
            [ -f "$ofl" ] || continue
            cp "$ofl" "$WORK/$NAME/LICENSES/OFL-$(basename "$(dirname "$ofl")").txt"
          done
          {
            echo "product=Sinopia Pro (Evora), étage Pro de Sinopia"
            echo "upstream=storytold/vectorcraft"
            echo "upstream_tag=$TAG"
            echo "fork=$GITHUB_REPOSITORY"
            echo "branch=$REF_NAME"
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "rustc=$(rustc -V)"
            echo "trunk=$(trunk --version)"
            echo "wasm-bindgen=$(wasm-bindgen --version)"
            echo "wasm-opt=$(wasm-opt --version)"
            echo "craft-fonts=$CRAFT_FONTS_REF"
            cat "$LIC_IN/EVORA-LICENCES.txt"
          } > "$WORK/$NAME/EVORA-BUILD.txt"
          {
            echo "name=$NAME"
            echo "pkg=$WORK/$NAME"
            echo "out=$OUT"
          } >> "$GITHUB_OUTPUT"

      - name: Porte « marques ArtCraft » (bloquante)
        if: ${{ !cancelled() && steps.pkg.outcome == 'success' }}
        run: python3 -I packaging/evora/gates.py brand "${{ steps.pkg.outputs.pkg }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Porte « fichiers d'hébergement » (bloquante)
        if: ${{ !cancelled() && steps.pkg.outcome == 'success' }}
        run: python3 -I packaging/evora/gates.py hosting "${{ steps.pkg.outputs.pkg }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Porte « termes sensibles » E9 (bloquante)
        if: ${{ !cancelled() && steps.pkg.outcome == 'success' }}
        run: python3 -I packaging/evora/gates.py terms . | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Porte « émojis des catalogues affichés » E10 (bloquante)
        if: ${{ !cancelled() && steps.pkg.outcome == 'success' }}
        run: python3 -I packaging/evora/gates.py emoji . --blocking | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Empreintes CSP (csp-hashes.txt)
        if: ${{ !cancelled() && steps.pkg.outcome == 'success' }}
        run: python3 -I packaging/evora/gates.py csp "${{ steps.pkg.outputs.pkg }}/index.html" "${{ steps.pkg.outputs.pkg }}/csp-hashes.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      # Cinq passages de smoke.mjs ; la porte est rouge si « base », « pont-ehp » ou « pont-ehp-neuf »
      # rougit, ou si un témoin sabordé reste vert ou rougit pour une autre raison que la sienne.
      - name: Porte « tests de fumée » (Chrome sans interface, iframe depuis une autre origine)
        if: ${{ !cancelled() && steps.pkg.outcome == 'success' }}
        env:
          PKG: ${{ steps.pkg.outputs.pkg }}
        run: |
          set +e
          set -u
          gate=0
          smoke() { # nom, puis les variables SMOKE_* du passage
            local name="$1"
            shift
            env "$@" node packaging/evora/smoke.mjs "$PKG" "$RUNNER_TEMP/evora-smoke-$name.json" "$CHROME_BIN" > "$RUNNER_TEMP/evora-smoke-$name.out" 2>&1
            local rc=$?
            python3 -I packaging/evora/gates.py smoke-summary "$RUNNER_TEMP/evora-smoke-$name.json" "$name" > "$RUNNER_TEMP/evora-smoke-$name.md"
            cat "$RUNNER_TEMP/evora-smoke-$name.md" >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/evora-smoke-$name.md"
            tail -n 60 "$RUNNER_TEMP/evora-smoke-$name.out"
            return "$rc"
          }
          red() { # nom, any|only, motifs : le passage sabordé doit être rouge pour ces raisons
            local name="$1"
            shift
            python3 -I packaging/evora/gates.py smoke-red "$RUNNER_TEMP/evora-smoke-$name.json" "$@" > "$RUNNER_TEMP/evora-red-$name.md"
            local rc=$?
            cat "$RUNNER_TEMP/evora-red-$name.md" >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/evora-red-$name.md"
            return "$rc"
          }
          # « base » : langue imposée (E3, zh-Hans → zh-hans), thème clair au rendu (E2, barre
          # #e4e4e4), ?host=evora avec l'evora-host.json de l'artefact (vide) : la copie de
          # récupération semée reste (aucune purge sur simple paramètre d'URL, E5), le témoin aussi,
          # et la page parente ne reçoit aucun message (pont muet, E4).
          smoke base SMOKE_LANG=zh-Hans SMOKE_EXPECT_LANG=zh-hans SMOKE_HOST=evora SMOKE_SEED=1 \
            SMOKE_THEME=light SMOKE_EXPECT_BAR=e4e4e4 || gate=1
          # « pont-ehp » : origine B admise par evora-host.json (servi par le banc comme l'écrirait le
          # provisionnement) ; déroulé complet du pont EHP v1 et de la purge (smoke.mjs, ehpScenario).
          smoke pont-ehp SMOKE_EHP=1 SMOKE_LANG=en SMOKE_HOST=evora SMOKE_SEED=1 \
            SMOKE_THEME=light SMOKE_EXPECT_BAR=e4e4e4 || gate=1
          # « pont-ehp-neuf » : même déroulé, le document s'ouvre vierge, sans octets
          # (evora:open {new: true} : document qui n'a pas encore de fichier Drive, HOST-PROTOCOL §7.1).
          smoke pont-ehp-neuf SMOKE_EHP=1 SMOKE_EHP_NEW=1 SMOKE_LANG=en SMOKE_HOST=evora SMOKE_SEED=1 \
            SMOKE_THEME=light SMOKE_EXPECT_BAR=e4e4e4 || gate=1
          # Témoins sabordés : le même banc doit rougir.
          smoke temoin-origine SMOKE_EHP=1 SMOKE_SABOTAGE=origin SMOKE_LANG=en SMOKE_HOST=evora SMOKE_SEED=1 SMOKE_THEME=light
          red temoin-origine any "evora:ready reçu 0 fois" || gate=1
          smoke temoin-detecteurs SMOKE_EHP=1 SMOKE_SABOTAGE=detectors SMOKE_LANG=en SMOKE_HOST=evora SMOKE_SEED=1 SMOKE_THEME=light
          red temoin-detecteurs only "réponse à un message qui devait être ignoré" "stockage du moteur vide après evora:purge" || gate=1
          echo "verdict de la porte des tests de fumée : $([ "$gate" -eq 0 ] && echo VERTE || echo ROUGE)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$gate"

      - name: Sorties précompressées .br et .gz, mesure de taille
        if: ${{ !cancelled() && steps.pkg.outcome == 'success' }}
        run: python3 -I packaging/evora/gates.py precompress "${{ steps.pkg.outputs.pkg }}" | tee -a "$GITHUB_STEP_SUMMARY"

      # Mesures sans verdict : set +e et exit 0 ; pas de continue-on-error, qui masquerait un
      # résumé tronqué.
      - name: Mesures (information) et preuve de wasm-opt
        if: ${{ !cancelled() && steps.pkg.outcome == 'success' }}
        env:
          PKG: ${{ steps.pkg.outputs.pkg }}
        run: |
          set +e
          set -u -o pipefail
          sha() { sha256sum "$1" 2>/dev/null | cut -d' ' -f1; }
          {
            echo "### wasm-opt a-t-il tourné ? (sorties intermédiaires de Trunk dans target/)"
            BG="$(find target/wasm-bindgen/release -maxdepth 1 -name '*_bg.wasm' 2>/dev/null | head -n 1)"
            WO="$(find target/wasm-opt/release -maxdepth 1 -name '*_bg.wasm' 2>/dev/null | head -n 1)"
            DW="$(find "$PKG" -maxdepth 1 -name '*_bg.wasm' | head -n 1)"
            for f in "$BG" "$WO" "$DW"; do
              [ -n "$f" ] && echo "- \`$f\` : $(stat -c %s "$f") octets, sha256 $(sha "$f")"
            done
            if [ -n "$WO" ] && [ -n "$BG" ] && [ "$(sha "$DW")" = "$(sha "$WO")" ] && [ "$(sha "$DW")" != "$(sha "$BG")" ]; then
              echo "- verdict : le .wasm livré est la sortie de wasm-opt, distincte de celle de wasm-bindgen"
            else
              echo "- verdict : NON PROUVÉ (le .wasm livré n'est pas identifié comme sortie de wasm-opt)"
            fi
            echo
            echo "- site complet hors LICENSES/ et hors .br/.gz : $(find "$PKG" -type f ! -path "$PKG/LICENSES/*" ! -name '*.br' ! -name '*.gz' -printf '%s\n' | awk '{s+=$1} END {print s}') octets"
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Archive, SHA256SUMS (seulement si toutes les portes sont vertes)
        id: zip
        env:
          PKG: ${{ steps.pkg.outputs.pkg }}
          OUT: ${{ steps.pkg.outputs.out }}
          NAME: ${{ steps.pkg.outputs.name }}
        run: |
          set -euo pipefail
          [ -s "$PKG/csp-hashes.txt" ] || { echo "::error::csp-hashes.txt absent"; exit 1; }
          cp "$PKG/csp-hashes.txt" "$OUT/csp-hashes.txt"
          (cd "$(dirname "$PKG")" && zip -qrX9 "$OUT/$NAME.zip" "$NAME")
          (cd "$OUT" && sha256sum "$NAME.zip" csp-hashes.txt > SHA256SUMS)
          {
            echo "### Artefact"
            echo
            echo "\`$NAME.zip\` : $(stat -c %s "$OUT/$NAME.zip") octets"
            echo
            echo '```'
            cat "$OUT/SHA256SUMS"
            echo '```'
            echo
            echo "<details><summary>Contenu de l'archive</summary>"
            echo
            echo '```'
            (cd "$(dirname "$PKG")" && find "$NAME" -type f -printf '%s\t%p\n' | sort -k2)
            echo '```'
            echo "</details>"
            echo
            echo "Fin des portes."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publication de l'artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            ${{ steps.pkg.outputs.out }}/${{ steps.pkg.outputs.name }}.zip
            ${{ steps.pkg.outputs.out }}/SHA256SUMS
            ${{ steps.pkg.outputs.out }}/csp-hashes.txt
          if-no-files-found: error
