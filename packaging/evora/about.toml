# cargo-about : configuration écrite par Evora (fork tazerty/vectorcraft, EVORA-SIN-04, CI).
# Agrège les licences des composants Rust du build web (cible wasm32, sans dépendances de
# développement) dans LICENSES/THIRD-PARTY-LICENSES.txt de l'artefact. Ordre de préférence quand
# une crate offre un choix : MIT d'abord, puis Apache-2.0.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "OFL-1.1",
    "LicenseRef-UFL-1.0",
    "CC0-1.0",
]
targets = ["wasm32-unknown-unknown"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
ignore-transitive-dependencies = false
